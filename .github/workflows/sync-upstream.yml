name: Sync upstream Libraries

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-libraries
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch upstream history
        run: |
          git remote add upstream https://github.com/joecare99/CSharp.git
          git fetch upstream master
          git subtree split --prefix=CSharpBible/Libraries upstream/master -b upstream-libraries

      - name: Merge upstream history
        run: |
          if git merge-base --is-ancestor upstream-libraries HEAD; then
            echo "Upstream history is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit --allow-unrelated-histories -X theirs upstream-libraries
          git push origin "HEAD:${GITHUB_REF_NAME}"
